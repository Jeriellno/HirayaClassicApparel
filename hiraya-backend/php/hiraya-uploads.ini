; Upload limits for Hiraya — loaded by start-backend.ps1 (PHP_INI_SCAN_DIR)
; and copied into the Docker image. PHP's defaults (2M per file, 8M per
; request) reject product saves with colour photos as HTTP 413. These match
; ProductRequest (5-10 MB per file) with room for several colours per product.
upload_max_filesize = 12M
post_max_size = 100M
max_file_uploads = 60
memory_limit = 512M
