<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1250" viewBox="0 0 1000 1250">
  <!-- Streetwear / Urban: a graffiti brick wall on a city sidewalk at dusk. -->
  <defs>
    <pattern id="brick" width="120" height="60" patternUnits="userSpaceOnUse">
      <rect width="120" height="60" fill="#2A2528"/>
      <rect x="3" y="3" width="114" height="24" fill="#4E4144"/>
      <rect x="-57" y="33" width="114" height="24" fill="#47393C"/>
      <rect x="63" y="33" width="114" height="24" fill="#524447"/>
    </pattern>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1A22" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#1A1A22" stop-opacity="0"/>
      <stop offset="1" stop-color="#1A1A22" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="walk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B5B66"/>
      <stop offset="1" stop-color="#34343C"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD98A" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFD98A" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1000" height="1000" fill="url(#brick)"/>

  <!-- graffiti -->
  <g opacity="0.85">
    <path d="M60 520 C 120 380 260 360 330 460 C 390 540 300 660 200 640 C 110 620 30 620 60 520 z" fill="#E0457B"/>
    <path d="M640 470 C 720 360 900 380 950 500 C 990 600 880 700 770 660 C 670 630 580 580 640 470 z" fill="#2EC4B6"/>
    <path d="M120 300 C 200 240 320 250 360 320 C 300 300 220 300 160 340 z" fill="#F9C74F"/>
    <path d="M700 300 C 760 240 880 250 920 320 C 850 300 780 310 720 350 z" fill="#9B5DE5"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M90 560 c30 -60 60 -60 70 0 s40 40 70 -30 s50 -30 60 20" stroke="#FFFFFF" stroke-width="12"/>
    <path d="M670 540 c20 -50 60 -60 80 -10 s30 40 60 -20 s40 -30 70 10" stroke="#1A1A22" stroke-width="12"/>
    <path d="M150 700 l40 -30 l20 40 l40 -40" stroke="#F9C74F" stroke-width="8"/>
    <path d="M760 720 l30 -40 l30 30 l30 -40 l30 30" stroke="#E0457B" stroke-width="8"/>
  </g>
  <g fill="#FFFFFF" opacity="0.6">
    <circle cx="330" cy="720" r="6"/><circle cx="350" cy="740" r="4"/><circle cx="600" cy="690" r="5"/>
    <circle cx="880" cy="760" r="6"/><circle cx="90" cy="420" r="4"/>
  </g>

  <!-- neon sign -->
  <rect x="700" y="110" width="220" height="110" rx="18" fill="none" stroke="#FF4FA3" stroke-width="10" filter="url(#neon)"/>
  <rect x="700" y="110" width="220" height="110" rx="18" fill="none" stroke="#FFC2E0" stroke-width="4"/>
  <path d="M740 180 l30 -40 l30 40 l30 -40 l30 40 l30 -40" fill="none" stroke="#7CF5FF" stroke-width="5" stroke-linecap="round"/>

  <!-- street lamp, left -->
  <circle cx="120" cy="180" r="160" fill="url(#lamp)"/>
  <rect x="30" y="160" width="14" height="840" fill="#1C1C22"/>
  <path d="M37 170 Q 60 130 120 140" stroke="#1C1C22" stroke-width="10" fill="none"/>
  <path d="M95 140 h60 l-10 30 h-40 z" fill="#2A2A33"/>
  <ellipse cx="125" cy="172" rx="22" ry="6" fill="#FFE7A8"/>

  <rect width="1000" height="1000" fill="url(#dusk)"/>

  <!-- sidewalk + curb -->
  <rect x="0" y="1000" width="1000" height="250" fill="url(#walk)"/>
  <rect x="0" y="994" width="1000" height="10" fill="#6E6E7A"/>
  <g stroke="#2E2E36" stroke-width="3">
    <line x1="0" y1="1110" x2="1000" y2="1110"/>
    <line x1="160" y1="1004" x2="110" y2="1110"/><line x1="480" y1="1004" x2="470" y2="1110"/>
    <line x1="800" y1="1004" x2="840" y2="1110"/>
    <line x1="60" y1="1110" x2="0" y2="1250"/><line x1="460" y1="1110" x2="450" y2="1250"/>
    <line x1="880" y1="1110" x2="960" y2="1250"/>
  </g>
  <path d="M600 1150 l30 20 l-10 30 l40 25" stroke="#2A2A31" stroke-width="2" fill="none"/>
</svg>
